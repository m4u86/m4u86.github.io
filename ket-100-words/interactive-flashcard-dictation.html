    h1 { font-size: 24px; color: var(--dark); margin-bottom: 6px; font-weight: 800; }

    .en-def-box { background: #f8fafc; border-left: 4px solid var(--primary); padding: 12px 16px; border-radius: 4px 12px 12px 4px; margin-bottom: 16px; font-size: 14.5px; line-height: 1.5; color: #1e293b; }
    .example-box { background: #fffbeb; border-left: 4px solid #f59e0b; padding: 10px 16px; border-radius: 4px 12px 12px 4px; margin-bottom: 16px; font-size: 13.5px; color: #78350f; font-style: italic; }

    /* Word Family */

    .nav-btn.primary:hover:not(:disabled) { background: #4338ca; }

    let currentList = [];
    let currentIndex = 0;
    let currentMode = 'card';
    let currentAudio = null;
    const audioCache = new Map();

    function getAudioForWord(wordText) {
      if (!audioCache.has(wordText)) {
        const audio = new Audio(`https://dict.youdao.com/dictvoice?audio=${encodeURIComponent(wordText)}&type=1`);
        audio.preload = 'auto';
        audioCache.set(wordText, audio);
      }
      return audioCache.get(wordText);
    }

    function onSelectDay(val) {
      if (val === 'all') {
        currentList = WORDS;
      } else {
        const d = parseInt(val, 10);
        const group = DAY_CONFIG.find(g => g.day === d);
        if (group) {
          currentList = group.ids.map(id => WORDS.find(w => w.id === id)).filter(Boolean);
        } else {
          currentList = WORDS.slice(0, 9);
        }
      }
      currentIndex = 0;
      render();
      if (currentMode === 'dict') {
        setTimeout(() => {
          document.getElementById('dictInput').focus();
          speakCurrentWord();
        }, 150);
      }
    }

    function setMode(mode) {
      currentMode = mode;
      document.getElementById('btnModeCard').classList.toggle('active', mode === 'card');
      document.getElementById('btnModeDict').classList.toggle('active', mode === 'dict');
      render();
      if (mode === 'dict') {
        setTimeout(() => {
          document.getElementById('dictInput').focus();
          speakCurrentWord();
        }, 150);
      }
    }

    function renderFamilyTags(containerId, familyList) {
      const container = document.getElementById(containerId);
      container.innerHTML = '';
      if (!familyList || familyList.length === 0) {
        container.innerHTML = '<span style="font-size:12px; color:#94a3b8;">暂无派生词</span>';
        return;
      }
      familyList.forEach(item => {
        const tag = document.createElement('span');
        tag.className = 'family-tag';
        tag.innerHTML = `<strong>${item.word}</strong> <span style="font-size:11px; opacity:0.8;">(${item.pos} ${item.mean})</span>`;
        container.appendChild(tag);
      });
    }

    function render() {
      if (!currentList || currentList.length === 0) return;
      const item = currentList[currentIndex];
      const total = currentList.length;

      document.getElementById('statsCounter').innerText = `第 ${currentIndex + 1} / ${total} 词`;
      document.getElementById('wordNo').innerText = `#${item.id} / 100`;
      document.getElementById('progressFill').style.width = `${((currentIndex + 1) / total) * 100}%`;

      document.getElementById('btnPrev').disabled = currentIndex === 0;
      document.getElementById('btnNext').innerText = currentIndex === total - 1 ? "完成本组 🎉" : "下一词";

      // Preload next word audio
      if (currentIndex + 1 < total) {
        getAudioForWord(currentList[currentIndex + 1].word);
      }

      if (currentMode === 'card') {
        document.getElementById('flashcardContent').style.display = 'block';
        document.getElementById('dictationContent').style.display = 'none';

        document.getElementById('wordText').innerText = item.word;
        document.getElementById('wordPhonetic').innerText = item.phonetic;
        document.getElementById('wordPos').innerText = item.pos;
        document.getElementById('wordMeaning').innerText = item.meaning;
        document.getElementById('wordEnDef').innerText = item.enDef;
        document.getElementById('wordExample').innerText = `"${item.example}"`;

        renderFamilyTags('wordFamily', item.family);
      } else {
        document.getElementById('flashcardContent').style.display = 'none';
        document.getElementById('dictationContent').style.display = 'flex';

        document.getElementById('dictMeaning').innerText = `[${item.pos}] ${item.meaning}`;
        const hint = item.word.split(' ').map(w => w[0] + ' ' + '_ '.repeat(w.length - 1)).join('   ');
        document.getElementById('dictHint').innerText = `首字母线索：${hint}`;

        const input = document.getElementById('dictInput');
        input.value = '';
        input.className = 'dict-input';
        document.getElementById('resultFeedback').innerText = '';
        document.getElementById('dictRevealBox').style.display = 'none';
      }
    }

    function speakCurrentWord() {
      if (!currentList || currentList.length === 0) return;
      const item = currentList[currentIndex];
      if (!item) return;

      try {
        if (currentAudio) {
          currentAudio.pause();
          currentAudio.currentTime = 0;
        }

        const audio = getAudioForWord(item.word);
        currentAudio = audio;
        audio.currentTime = 0;
        const playPromise = audio.play();

        if (playPromise !== undefined) {
          playPromise.catch(() => {
            fallbackSpeech(item.word);
          });
        }
      } catch (err) {
        fallbackSpeech(item.word);
      }
    }

    function fallbackSpeech(wordText) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(wordText);
        utterance.lang = 'en-GB';
        utterance.rate = 1.0;
        window.speechSynthesis.speak(utterance);
      }
    }

    function nextWord() {
      if (currentIndex < currentList.length - 1) {
        currentIndex++;
        render();
        if (currentMode === 'dict') {
          setTimeout(() => {
            document.getElementById('dictInput').focus();
            speakCurrentWord();
          }, 150);
        }
      } else {
        alert("🎉 恭喜！本课全部单词已顺利通关！");
      }
    }

    function prevWord() {
      if (currentIndex > 0) {
        currentIndex--;
        render();
      }
    }

    // Dictation Enter Check
    document.getElementById('dictInput').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        const item = currentList[currentIndex];
        const val = this.value.trim().toLowerCase();
        const fb = document.getElementById('resultFeedback');
        const reveal = document.getElementById('dictRevealBox');

        if (val === item.word.toLowerCase()) {
          this.className = 'dict-input correct';
          fb.style.color = '#10b981';
          fb.innerText = '✅ 拼写完全正确！太棒了！';

          reveal.style.display = 'block';
          document.getElementById('dictEnDef').innerText = `📖 英英释义: ${item.enDef}`;
          renderFamilyTags('dictFamily', item.family);

          setTimeout(() => {
            nextWord();
          }, 1500);
        } else {
          this.className = 'dict-input wrong';
          fb.style.color = '#ef4444';
          fb.innerText = `❌ 拼写有误，正确拼写是：${item.word}`;
          reveal.style.display = 'block';
          document.getElementById('dictEnDef').innerText = `📖 英英释义: ${item.enDef}`;
          renderFamilyTags('dictFamily', item.family);
          speakCurrentWord();
        }
      }
    });

    // Initialize with Day 1
    onSelectDay('1');
  </script>
</body>
</html>
